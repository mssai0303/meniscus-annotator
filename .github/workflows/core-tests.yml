name: Synthetic core tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_core.py tests/test_correction_jobs.py tests/test_practice_context.py tests/test_layouts.py tests/test_reader_identity.py tests/test_ui_guards.py packaging/prebuilt/tests -q
