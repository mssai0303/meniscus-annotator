name: Windows prebuilt installer
on:
  workflow_dispatch:
    inputs:
      run_integration:
        description: Run installed synthetic correction, real Export dialog, restart and general workflow checks (not human Windows acceptance)
        required: true
        default: true
        type: boolean
      fast_package:
        description: Use faster zlib compression for a development candidate; payload and acceptance checks are unchanged
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: windows-prebuilt-installer
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      MENISCUS_BUILD_ROOT: 'C:\D\MP'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check correction contract before packaging
        shell: pwsh
        run: |
          $parseErrors = @()
          Get-ChildItem .\packaging\prebuilt\*.ps1 | ForEach-Object {
            $tokens = $null
            $errorsForFile = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errorsForFile) | Out-Null
            $parseErrors += $errorsForFile
          }
          if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; throw 'Maintainer PowerShell syntax check failed.' }
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency installation failed.' }
          python -m pytest tests packaging/prebuilt/tests --ignore=tests/preparation -q
          if ($LASTEXITCODE -ne 0) { throw 'Correction contract tests failed.' }
      - name: Build and test installation with pinned prebuilt runtime
        shell: pwsh
        env:
          RUN_INTEGRATION: ${{ inputs.run_integration }}
          FAST_PACKAGE: ${{ inputs.fast_package }}
        run: |
          $integration = $env:RUN_INTEGRATION -eq 'true'
          $fast = $env:FAST_PACKAGE -eq 'true'
          & .\packaging\prebuilt\build.ps1 -BuildRoot $env:MENISCUS_BUILD_ROOT -TestInstall -RunIntegration:$integration -FastPackage:$fast
      - name: Retain installer and maintainer evidence for one day
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MeniscusAnnotator-0.1.0-Windows-x64-${{ github.sha }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
          path: |
            C:\D\MP\MeniscusAnnotator-0.1.0-Windows-x64.exe
            C:\D\MP\installer-build.json
            C:\D\MP\download-receipts.jsonl
            C:\D\MP\installed-runtime-check.json
            C:\D\MP\graphics-probe\*.json
            C:\D\MP\graphics-probe\*.txt
            C:\D\MP\graphics-probe\*.png
            C:\D\MP\synthetic-generation\*.json
            C:\D\MP\synthetic-generation\*.txt
            C:\D\MP\synthetic-integration\*.json
            C:\D\MP\synthetic-integration\*.png
            C:\D\MP\synthetic-resume\*.json
            C:\D\MP\synthetic-correction\*.json
            C:\D\MP\synthetic-correction\*.png
            C:\D\MP\synthetic-correction\*.txt
            C:\D\MP\synthetic-correction-resume\*.json
            C:\D\MP\synthetic-correction-resume\*.txt
            C:\D\MP\synthetic-draw*\*.json
            C:\D\MP\synthetic-draw*\*.txt
            C:\D\MP\synthetic-draw*\*.png
